
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Morel Guyto | IT Technician</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --accent: #38bdf8;
      --accent-soft: #0ea5e9;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --card: #111827;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      padding: 2rem 8vw 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(15,23,42,0.9), rgba(15,23,42,0.4));
      z-index: 10;
      border-bottom: 1px solid rgba(148,163,184,0.2);
    }
    .logo {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--muted);
    }
    nav a {
      margin-left: 1.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    nav a:hover { color: var(--accent); }

    main { padding: 3rem 8vw 4rem; max-width: 1100px; margin: 0 auto; }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.5fr);
      gap: 3rem;
      align-items: center;
      padding-bottom: 3rem;
      border-bottom: 1px solid rgba(148,163,184,0.2);
    }
    .hero-title {
      font-size: 2.4rem;
      font-weight: 700;
    }
    .hero-title span {
      color: var(--accent);
    }
    .hero-sub {
      margin-top: 0.75rem;
      color: var(--muted);
      max-width: 32rem;
    }
    .hero-meta {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .hero-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .hero-actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      background: transparent;
      color: var(--text);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      border: none;
      color: #0b1120;
      font-weight: 600;
    }
    .btn-primary:hover {
      filter: brightness(1.05);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hero-card {
      background: radial-gradient(circle at top left, #1e293b 0, #020617 55%);
      border-radius: 1.5rem;
      padding: 1.8rem;
      border: 1px solid rgba(148,163,184,0.3);
      box-shadow: 0 24px 60px rgba(15,23,42,0.8);
    }
    .hero-card h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .hero-card p {
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .hero-card-tag {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* Sections */
    section {
      margin-top: 3rem;
    }
    section h2 {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr);
      gap: 2.5rem;
    }

    .card {
      background: var(--card);
      border-radius: 1.2rem;
      padding: 1.5rem 1.6rem;
      border: 1px solid rgba(148,163,184,0.25);
    }
    .card h3 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }
    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .pill {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .timeline-item {
      position: relative;
      padding-left: 1.4rem;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: 0.35rem;
      top: 0.2rem;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--accent);
    }
    .timeline-item::after {
      content: "";
      position: absolute;
      left: 0.55rem;
      top: 0.9rem;
      width: 1px;
      height: calc(100% - 0.9rem);
      background: rgba(148,163,184,0.4);
    }
    .timeline-title {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .timeline-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .timeline-body {
      font-size: 0.9rem;
      margin-top: 0.4rem;
      color: var(--text);
    }
    .timeline-tags {
      margin-top: 0.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .list {
      list-style: none;
      font-size: 0.9rem;
      color: var(--text);
    }
